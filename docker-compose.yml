services:
  postgres-category:
    image: postgres:15
    container_name: categorydb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: categorydb
    ports:
      - "5433:5432"
    volumes:
      - category_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network
        
  category-service:
    build: 
      context: ./
      dockerfile: Dockerfile
    env_file:
      - ./.env
    container_name: category_service
    ports:
      - ${HTTP_PORT:-8082}:${HTTP_PORT:-8082}
    depends_on:
      postgres-category:
        condition: service_healthy
    networks:
      - shared-network

volumes:
  category_postgres_data:

networks:
  shared-network:
    name: shared-broker-net
    external: true